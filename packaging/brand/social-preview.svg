<!-- Link preview image website/images/social-preview.png (1280 x 640): GitHub social preview
     (uploaded by hand in Settings -> General) and og:image / twitter:image of the website.
     Rendered by tools/make_website_images.sh with resvg, which embeds the app icon (icon.svg).
     Colours from the launcher icon (#E8618C rose, #FFF3B0 candle flame). 40 px clear at the edges. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="spBackground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A1630"/>
      <stop offset="0.55" stop-color="#2C0E1E"/>
      <stop offset="1" stop-color="#170711"/>
    </linearGradient>
    <radialGradient id="spGlow" cx="240" cy="320" r="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E8618C" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#E8618C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spWarmth" cx="1040" cy="120" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD36B" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFD36B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spTagline" x1="462" y1="0" x2="1100" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF8DB3"/>
      <stop offset="1" stop-color="#FFD36B"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#spBackground)"/>
  <rect width="1280" height="640" fill="url(#spGlow)"/>
  <rect width="1280" height="640" fill="url(#spWarmth)"/>

  <!-- app icon, left -->
  <image x="80" y="160" width="320" height="320" xlink:href="icon.svg"/>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="458" y="252" font-size="96" font-weight="700" fill="#FFFFFF" letter-spacing="-1">Birthday Sync</text>
    <text x="462" y="331" font-size="36" font-weight="700" fill="#FFFFFF">Your contacts’ birthdays in your calendar.</text>
    <text x="462" y="385" font-size="36" font-weight="700" fill="url(#spTagline)">Automatic, private, no internet access.</text>
    <text x="462" y="455" font-size="25" fill="#E3BFCD">Free, open-source birthday calendar sync for Android 8.0+</text>
    <text x="462" y="494" font-size="25" fill="#E3BFCD">Contacts · Google Calendar · Notifications · 40 languages</text>
  </g>
</svg>
