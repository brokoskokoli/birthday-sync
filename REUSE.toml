version = 1
SPDX-PackageName = "Birthday Sync"
SPDX-PackageDownloadLocation = "https://github.com/brokoskokoli/birthday-sync"

# Licensing per REUSE (https://reuse.software), checked in CI with `reuse lint`.
# This file adds the copyright notice and the licence for everything, so that files without a
# comment header (app sources, resources, store texts, images) are covered as well. Licence texts
# live in LICENSES/ (`reuse download --all`); LICENSE is the same MIT text for GitHub.

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Stefan Richter"
SPDX-License-Identifier = "MIT"

# Gradle wrapper scripts and JAR (generated by Gradle, unchanged).
[[annotations]]
path = ["gradlew", "gradlew.bat", "gradle/wrapper/gradle-wrapper.jar"]
precedence = "override"
SPDX-FileCopyrightText = "2015-2021 the original authors of Gradle"
SPDX-License-Identifier = "Apache-2.0"

# The Code of Conduct is the Contributor Covenant 2.1 (CC-BY-4.0); only the contact paragraph
# under "Enforcement" is adapted.
[[annotations]]
path = "CODE_OF_CONDUCT.md"
precedence = "override"
SPDX-FileCopyrightText = "2014-2021 Coraline Ada Ehmke and the Contributor Covenant contributors"
SPDX-License-Identifier = "CC-BY-4.0"
