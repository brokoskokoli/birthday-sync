# Tag v<versionName> → signed APK + AAB, release text from the CHANGELOG.md section
# "## [X.Y.Z] - date". The release is created as a draft and only published once all files are uploaded.
name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: Build, sign and publish
    if: github.repository == 'brokoskokoli/birthday-sync'
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - name: Release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { f = 1; next }
            f && /^## \[/ { exit }
            f && /^\[[^]]+\]: http/ { next }
            f { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > "$RUNNER_TEMP/notes.md"
          if [[ ! -s "$RUNNER_TEMP/notes.md" ]]; then
            echo "::error::CHANGELOG.md has no section \"## [$version]\" - add the release notes there"
            exit 1
          fi
      - name: Tests and lint
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug
      - name: Build and sign
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: tools/ci/build_signed.sh "${GITHUB_REF_NAME#v}" --require-version
      - name: Create draft, upload, publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$tag" -R "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$tag" -R "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "Birthday Sync ${tag#v}" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release upload "$tag" -R "$GITHUB_REPOSITORY" dist/* --clobber
          gh release edit "$tag" -R "$GITHUB_REPOSITORY" --draft=false --latest
